
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <meta name="theme-color" content="#f8fafc" data-light="#f8fafc" data-dark="#050816" />
      <meta name="color-scheme" content="light dark" />
      <script>
        (() => {
          let theme;
          try {
            theme = localStorage.getItem('portfolio-theme');
          } catch {
            // The system preference is still available when storage is blocked.
          }
          if (theme !== 'light' && theme !== 'dark') {
            theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          const root = document.documentElement;
          root.classList.toggle('dark', theme === 'dark');
          root.style.colorScheme = theme;
          document.querySelector('meta[name="color-scheme"]').content = theme;
          const themeColor = document.querySelector('meta[name="theme-color"]');
          themeColor.content = themeColor.dataset[theme];
        })();
      </script>
      <link rel="icon" type="image/x-icon" href="/favicon.ico" />
      <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
      <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
      <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
      <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
      <link rel="manifest" href="/site.webmanifest" />
      <title>Tariq Yasser</title>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
